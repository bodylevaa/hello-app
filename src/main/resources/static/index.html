<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello App — JS + Java</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <h1>Элементарный сайт</h1>
    <p class="subtitle">Фронтенд на JavaScript &middot; Бэкенд на Java (Spring Boot)</p>
  </header>

  <main>
    <section class="card">
      <h2>Оставить сообщение</h2>
      <form id="message-form">
        <input type="text" id="author" placeholder="Ваше имя" maxlength="50">
        <textarea id="text" placeholder="Текст сообщения" maxlength="300" required></textarea>
        <button type="submit">Отправить</button>
      </form>
      <p id="status"></p>
    </section>

    <section class="card">
      <h2>Сообщения с сервера</h2>
      <ul id="messages"></ul>
    </section>
  </main>

  <footer>
    <p>Статический фронт и REST API отдаются одним и тем же Java-приложением.</p>
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
